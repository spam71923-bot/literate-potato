name: Run Python Script and Save Outputs

on:
  push:
    branches: [ main ] # Runs every time you push to main
  workflow_dispatch:
    inputs:
      script_name:
        description: 'Name of the Python script to run (e.g., script.py)'
        required: true
        default: 'your_script.py'
        type: string

permissions:
  contents: write      # Required to push changes back to the repo

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    # Set a fallback default script name when triggered via 'push' instead of manually
    env:
      PYTHON_SCRIPT: ${{ github.event.inputs.script_name || 'your_script.py' }}

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Specify your preferred Python version

      # 3. Optional: Install dependencies if your script needs them
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run the dynamic Python script from the root workspace
      - name: Run script
        run: |
          echo "Running script: ${{ env.PYTHON_SCRIPT }}"
          python "${{ env.PYTHON_SCRIPT }}"

      # 5. Commit and push the generated files from the root
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes in the root
          git add .
          
          # Only commit and push if the script actually changed or added files
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update outputs from ${{ env.PYTHON_SCRIPT }} [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes detected. Skipping push."
          fi
